name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      # Required for pub.dev's OIDC-based trusted publishing; no API
      # credential needs to be stored as a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Publish
        run: dart pub publish --force
